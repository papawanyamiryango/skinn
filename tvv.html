<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Providence - Medical Animations RED/WHITE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --medical-red: #ff1744;
            --medical-red-light: #ff5177;
            --medical-white: #ffffff;
            --bg-dark: #0a1929;
            --bg-card: #132f4c;
            --accent-cyan: #00f2ff;
            --missed-red: #f43f5e;
            --border-glow: rgba(255, 23, 68, 0.4);
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a1929 0%, #1a237e 100%);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            color: var(--medical-white);
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 23, 68, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            animation: bgPulse 10s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        .tv-container {
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100vh;
            position: relative;
            z-index: 1;
            padding: 15px;
            gap: 15px;
        }

        /* ========== HEADER ========== */
        .header {
            background: rgba(19, 47, 76, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            border: 2px solid rgba(255, 23, 68, 0.3);
            box-shadow: 0 8px 32px rgba(255, 23, 68, 0.2);
        }

        .logo-container {
            width: 80px;
            height: 80px;
            animation: logoFloat 3s ease-in-out infinite;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(255, 23, 68, 0.5));
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .hospital-name h1 {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 12px;
            margin: 0;
            background: linear-gradient(90deg, var(--medical-white), var(--medical-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 23, 68, 0.5);
        }

        .hospital-name p {
            font-size: 1rem;
            letter-spacing: 4px;
            color: var(--medical-red);
            margin-top: 5px;
            opacity: 0.9;
        }

        /* ========== MAIN GRID ========== */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 2.5fr 0.8fr;
            gap: 15px;
            height: 100%;
        }

        .section-box {
            background: rgba(19, 47, 76, 0.6);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 25px;
            border: 2px solid var(--border-glow);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .section-title {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 12px;
            border-bottom: 3px solid;
        }

        /* ========== CURRENT SECTION WITH RED/WHITE MEDICAL THEME ========== */
        .now-calling {
            background: linear-gradient(135deg, 
                rgba(255, 23, 68, 0.15) 0%, 
                rgba(255, 255, 255, 0.05) 50%,
                rgba(255, 23, 68, 0.15) 100%);
            backdrop-filter: blur(25px);
            border: 5px solid transparent;
            background-clip: padding-box;
            position: relative;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: visible;
        }

        .now-calling::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            background: linear-gradient(45deg, 
                var(--medical-red), 
                var(--medical-white), 
                var(--medical-red));
            background-size: 300% 300%;
            border-radius: 24px;
            z-index: -1;
            animation: gradientMove 4s ease infinite;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ========== MEDICAL CROSSES (RED) ========== */
        .medical-cross {
            position: absolute;
            width: 70px;
            height: 70px;
            opacity: 0.5;
        }

        .medical-cross::before,
        .medical-cross::after {
            content: '';
            position: absolute;
            background: linear-gradient(135deg, var(--medical-red), var(--medical-red-light));
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(255, 23, 68, 0.6);
        }

        .medical-cross::before {
            width: 70px; height: 18px;
            top: 50%; left: 0;
            transform: translateY(-50%);
        }

        .medical-cross::after {
            width: 18px; height: 70px;
            left: 50%; top: 0;
            transform: translateX(-50%);
        }

        .cross-top-left {
            top: 30px; left: 30px;
            animation: crossRotate 4s ease-in-out infinite;
        }

        .cross-top-right {
            top: 30px; right: 30px;
            animation: crossRotate 4s ease-in-out infinite 1s;
        }

        .cross-bottom-left {
            bottom: 30px; left: 30px;
            animation: crossRotate 4s ease-in-out infinite 2s;
        }

        .cross-bottom-right {
            bottom: 30px; right: 30px;
            animation: crossRotate 4s ease-in-out infinite 3s;
        }

        @keyframes crossRotate {
            0%, 100% { transform: rotate(0deg) scale(1); opacity: 0.5; }
            50% { transform: rotate(180deg) scale(1.2); opacity: 0.8; }
        }

        /* ========== HEARTBEAT MONITOR (RED LINE) ========== */
        .heartbeat-container {
            position: absolute;
            top: 25px; left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 100px;
            overflow: hidden;
        }

        .ecg-line {
            width: 100%;
            height: 4px;
            background: var(--medical-red);
            position: absolute;
            top: 50%;
            animation: ecgPulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 15px var(--medical-red);
        }

        .ecg-spike {
            position: absolute;
            width: 150px;
            height: 80px;
            border: 4px solid var(--medical-red);
            top: 50%;
            transform: translateY(-50%);
            animation: ecgMove 2s linear infinite;
            clip-path: polygon(
                0% 50%, 10% 50%, 15% 20%, 20% 80%, 25% 50%,
                30% 50%, 35% 30%, 40% 70%, 45% 50%, 100% 50%
            );
            filter: drop-shadow(0 0 10px var(--medical-red));
        }

        @keyframes ecgMove {
            0% { left: -150px; }
            100% { left: 100%; }
        }

        @keyframes ecgPulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* ========== STETHOSCOPE ANIMATIONS (Multiple) ========== */
        .stethoscope {
            position: absolute;
            width: 100px;
            height: 100px;
            opacity: 0.4;
        }

        .steth-head {
            width: 35px; height: 35px;
            border: 5px solid var(--medical-red);
            border-radius: 50%;
            position: absolute;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 15px rgba(255, 23, 68, 0.6);
        }

        .steth-tube-l, .steth-tube-r {
            width: 4px; height: 50px;
            background: var(--medical-red);
            position: absolute;
            bottom: 35px;
            box-shadow: 0 0 10px rgba(255, 23, 68, 0.6);
        }

        .steth-tube-l { left: 25%; transform: rotate(-25deg); }
        .steth-tube-r { right: 25%; transform: rotate(25deg); }

        .steth-earpiece {
            width: 15px; height: 15px;
            background: var(--medical-red);
            border-radius: 50%;
            position: absolute;
            top: 0;
        }

        .steth-earpiece-l { left: 20%; }
        .steth-earpiece-r { right: 20%; }

        .steth-1 {
            bottom: 40px; left: 15%;
            animation: stethPulse 2s ease-in-out infinite;
        }

        .steth-2 {
            bottom: 40px; right: 15%;
            animation: stethPulse 2s ease-in-out infinite 0.5s;
        }

        .steth-3 {
            top: 120px; left: 50%;
            transform: translateX(-50%);
            animation: stethPulse 2s ease-in-out infinite 1s;
        }

        @keyframes stethPulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        /* ========== PILLS ANIMATION ========== */
        .pill {
            position: absolute;
            width: 40px;
            height: 20px;
            background: linear-gradient(90deg, var(--medical-red) 50%, var(--medical-white) 50%);
            border-radius: 20px;
            border: 2px solid var(--medical-red);
            opacity: 0;
            animation: pillFloat 4s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(255, 23, 68, 0.5);
        }

        .pill-1 { left: 10%; top: 30%; animation-delay: 0s; }
        .pill-2 { left: 20%; top: 60%; animation-delay: 0.5s; }
        .pill-3 { right: 10%; top: 25%; animation-delay: 1s; }
        .pill-4 { right: 20%; top: 55%; animation-delay: 1.5s; }
        .pill-5 { left: 30%; top: 80%; animation-delay: 2s; }
        .pill-6 { right: 30%; top: 75%; animation-delay: 2.5s; }

        @keyframes pillFloat {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            25% {
                opacity: 0.6;
            }
            50% {
                transform: translateY(-100px) rotate(180deg);
                opacity: 0.8;
            }
            75% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-200px) rotate(360deg);
                opacity: 0;
            }
        }

        /* ========== SYRINGE ANIMATIONS ========== */
        .syringe {
            position: absolute;
            width: 80px;
            height: 20px;
            opacity: 0.5;
        }

        .syringe-body {
            width: 60px; height: 20px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid var(--medical-red);
            border-radius: 4px;
            position: absolute;
            left: 0;
            box-shadow: 0 0 10px rgba(255, 23, 68, 0.4);
        }

        .syringe-plunger {
            width: 20px; height: 14px;
            background: var(--medical-red);
            position: absolute;
            right: 0; top: 3px;
            border-radius: 2px;
        }

        .syringe-needle {
            width: 25px; height: 2px;
            background: var(--medical-white);
            position: absolute;
            left: -25px; top: 9px;
        }

        .syringe-1 {
            top: 15%; left: 8%;
            animation: syringeMove 5s ease-in-out infinite;
        }

        .syringe-2 {
            top: 15%; right: 8%;
            transform: scaleX(-1);
            animation: syringeMove 5s ease-in-out infinite 1s;
        }

        .syringe-3 {
            bottom: 15%; left: 8%;
            animation: syringeMove 5s ease-in-out infinite 2s;
        }

        .syringe-4 {
            bottom: 15%; right: 8%;
            transform: scaleX(-1);
            animation: syringeMove 5s ease-in-out infinite 3s;
        }

        @keyframes syringeMove {
            0%, 100% {
                transform: translateX(0) translateY(0);
                opacity: 0.3;
            }
            50% {
                transform: translateX(30px) translateY(-20px);
                opacity: 0.7;
            }
        }

        /* ========== HEART BEAT ICONS ========== */
        .heart-icon {
            position: absolute;
            width: 50px;
            height: 50px;
            opacity: 0;
            animation: heartBeat 3s ease-in-out infinite;
        }

        .heart-icon::before,
        .heart-icon::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 40px;
            background: var(--medical-red);
            border-radius: 25px 25px 0 0;
            box-shadow: 0 0 20px rgba(255, 23, 68, 0.8);
        }

        .heart-icon::before {
            left: 0;
            transform: rotate(-45deg);
            transform-origin: 100% 100%;
        }

        .heart-icon::after {
            right: 0;
            transform: rotate(45deg);
            transform-origin: 0% 100%;
        }

        .heart-1 { top: 40%; left: 12%; animation-delay: 0s; }
        .heart-2 { top: 40%; right: 12%; animation-delay: 0.5s; }
        .heart-3 { top: 60%; left: 18%; animation-delay: 1s; }
        .heart-4 { top: 60%; right: 18%; animation-delay: 1.5s; }

        @keyframes heartBeat {
            0%, 100% {
                transform: scale(0.8);
                opacity: 0;
            }
            10% {
                transform: scale(1.2);
                opacity: 0.8;
            }
            20% {
                transform: scale(1);
                opacity: 1;
            }
            30% {
                transform: scale(1.1);
                opacity: 0.9;
            }
            40%, 90% {
                transform: scale(1);
                opacity: 0.7;
            }
        }

        /* ========== PULSE CIRCLES ========== */
        .pulse-circle {
            position: absolute;
            width: 120px; height: 120px;
            border-radius: 50%;
            border: 3px solid var(--medical-red);
            opacity: 0;
            animation: pulseExpand 3s ease-out infinite;
            box-shadow: 0 0 20px rgba(255, 23, 68, 0.5);
        }

        .pulse-1 { top: 60px; left: 60px; animation-delay: 0s; }
        .pulse-2 { top: 60px; right: 60px; animation-delay: 0.75s; }
        .pulse-3 { bottom: 60px; left: 60px; animation-delay: 1.5s; }
        .pulse-4 { bottom: 60px; right: 60px; animation-delay: 2.25s; }

        @keyframes pulseExpand {
            0% { transform: scale(0.3); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* ========== MEDICAL PARTICLES ========== */
        .medical-particle {
            position: absolute;
            width: 8px; height: 8px;
            background: var(--medical-red);
            border-radius: 50%;
            opacity: 0;
            animation: particleRise 5s ease-in-out infinite;
            box-shadow: 0 0 12px var(--medical-red);
        }

        .particle-1 { left: 15%; top: 25%; animation-delay: 0s; }
        .particle-2 { left: 25%; top: 70%; animation-delay: 0.7s; }
        .particle-3 { right: 15%; top: 35%; animation-delay: 1.4s; }
        .particle-4 { right: 25%; top: 65%; animation-delay: 2.1s; }
        .particle-5 { left: 45%; top: 15%; animation-delay: 2.8s; }
        .particle-6 { right: 45%; top: 85%; animation-delay: 3.5s; }
        .particle-7 { left: 35%; top: 50%; animation-delay: 4.2s; }
        .particle-8 { right: 35%; top: 50%; animation-delay: 4.9s; }

        @keyframes particleRise {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0;
            }
            30% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-350px) scale(0.3);
                opacity: 0;
            }
        }

        /* ========== MAIN CONTENT ========== */
        .calling-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .enter-label-container {
            background: rgba(255, 23, 68, 0.25);
            border: 3px solid var(--medical-red);
            padding: 20px 60px;
            border-radius: 20px;
            box-shadow: 
                0 0 40px rgba(255, 23, 68, 0.5),
                inset 0 0 30px rgba(255, 23, 68, 0.2);
            animation: labelPulse 2s ease-in-out infinite;
        }

        @keyframes labelPulse {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 0 0 40px rgba(255, 23, 68, 0.5);
            }
            50% { 
                transform: scale(1.05);
                box-shadow: 0 0 60px rgba(255, 23, 68, 0.8);
            }
        }

        .enter-label {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--medical-white);
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 
                0 0 20px rgba(255, 23, 68, 0.8),
                0 0 40px rgba(255, 23, 68, 0.5);
        }

        .number-section {
            position: relative;
            padding: 40px;
        }

        .current-id {
            font-size: 22rem;
            font-weight: 900;
            line-height: 0.9;
            background: linear-gradient(135deg, 
                var(--medical-red) 0%, 
                var(--medical-white) 50%,
                var(--medical-red) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 80px rgba(255, 23, 68, 0.8));
            animation: numberZoomIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes numberZoomIn {
            0% {
                transform: scale(0.3) rotate(-5deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.1) rotate(2deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .name-section {
            background: rgba(255, 23, 68, 0.15);
            border: 2px solid rgba(255, 23, 68, 0.4);
            padding: 25px 50px;
            border-radius: 20px;
            min-width: 600px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(255, 23, 68, 0.3);
        }

        .current-name {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--medical-white);
            text-transform: uppercase;
            letter-spacing: 4px;
            animation: fadeInUp 1s ease;
            text-shadow: 
                0 2px 10px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(255, 23, 68, 0.4);
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .flash-border {
            animation: flashBorder 0.8s ease-in-out 4;
        }

        @keyframes flashBorder {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.5); transform: scale(1.02); }
        }

        /* ========== WAITING & MISSED ========== */
        .waiting-section .section-title {
            background: rgba(255, 23, 68, 0.2);
            color: var(--medical-red);
            border-bottom-color: var(--medical-red);
        }

        .list-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        .list-container::-webkit-scrollbar { width: 8px; }
        .list-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .list-container::-webkit-scrollbar-thumb {
            background: rgba(255, 23, 68, 0.4);
            border-radius: 10px;
        }

        .patient-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border-left: 4px solid var(--medical-red);
            transition: all 0.3s ease;
            animation: slideInRight 0.5s ease;
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .patient-row:hover {
            background: rgba(255, 23, 68, 0.15);
            transform: translateX(5px);
        }

        .patient-name {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--medical-white);
        }

        .patient-id {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--medical-red);
            text-shadow: 0 0 10px rgba(255, 23, 68, 0.5);
        }

        .missed-section .section-title {
            background: rgba(244, 63, 94, 0.2);
            color: var(--missed-red);
            border-bottom-color: var(--missed-red);
            font-size: 1.1rem;
        }

        .missed-row {
            background: rgba(244, 63, 94, 0.08);
            border-left-color: var(--missed-red);
            padding: 12px 16px;
        }

        .missed-row .patient-name { font-size: 1rem; opacity: 0.8; }
        .missed-row .patient-id {
            font-size: 1.4rem;
            color: var(--missed-red);
            text-shadow: 0 0 8px rgba(244, 63, 94, 0.5);
        }

        /* ========== BOTTOM DISPLAY ========== */
        .bottom-display {
            background: linear-gradient(135deg, rgba(255, 23, 68, 0.25), rgba(255, 255, 255, 0.1));
            backdrop-filter: blur(25px);
            border-radius: 20px;
            padding: 30px;
            border: 3px solid var(--medical-red);
            box-shadow: 
                0 -8px 32px rgba(255, 23, 68, 0.4),
                inset 0 0 30px rgba(255, 23, 68, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        .bottom-label {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--medical-red);
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(32, 56, 192, 0.8);
        }

        .bottom-number {
            font-size: 10rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--medical-red), var(--medical-white));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 40px rgba(255, 23, 68, 0.8));
            animation: numberZoomIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .bottom-name {
            font-size: 3rem;
            font-weight: 700;
            color: var(--medical-white);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="tv-container">
        <div class="header">
            <div class="logo-container">
                <img src="la-providence-logo.png" alt="La Providence Logo">
            </div>
            <div class="hospital-name">
                <h1>LA PROVIDENCE</h1>
                <p>POLYCLINIQUE MEDICALE</p>
            </div>
            <div class="logo-container">
                <img src="la-providence-logo.png" alt="La Providence Logo">
            </div>
        </div>

        <div class="content-grid">
            <div class="section-box waiting-section">
                <div class="section-title">⏳ ABATEGEREJE</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuNz2dvLH3NgwzQys9__0sTN0L1kbomFY",
            authDomain: "providence-e77b1.firebaseapp.com",
            databaseURL: "https://providence-e77b1-default-rtdb.firebaseio.com",
            projectId: "providence-e77b1",
            storageBucket: "providence-e77b1.firebasestorage.app",
            messagingSenderId: "1042528351641",
            appId: "1:1042528351641:web:2b1b1231e4341ccf73cf08"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const queueRef = db.ref('queue');
        const ding = document.getElementById('ding');

        let lastId = null;

        queueRef.on('value', (snapshot) => {
            const data = snapshot.val() || {};
            const current = data.c || null;
            const pending = data.p || [];
            const missed = data.m || [];

            const newId = current ? current.id : "--";
            const newName = current ? current.name : "TEGEREZA...";

            document.getElementById('currId').innerText = newId;
            document.getElementById('currName').innerText = newName;

            document.getElementById('bottomId').innerText = newId;
            document.getElementById('bottomName').innerText = newName !== "TEGEREZA..." ? newName : "";

            if (newId !== lastId && newId !== "--") {
                ding.play().catch(() => console.log("Click to enable audio"));
                
                const mainBox = document.getElementById('mainBox');
                mainBox.classList.add('flash-border');
                setTimeout(() => mainBox.classList.remove('flash-border'), 3200);
                
                lastId = newId;
            }

            document.getElementById('waitingList').innerHTML = pending.length > 0 
                ? pending.slice(0, 10).map((p, i) => `
                    <div class="patient-row" style="animation-delay: ${i * 0.1}s">
                        <span class="patient-name">${p.name}</span>
                        <span class="patient-id">${p.id}</span>
                    </div>
                `).join('') 
                : '<div class="empty-state">Nta muntu uri ku murongo</div>';

            document.getElementById('missedList').innerHTML = missed.length > 0 
                ? missed.slice(-6).reverse().map((p, i) => `
                    <div class="patient-row missed-row" style="animation-delay: ${i * 0.1}s">
                        <span class="patient-name">${p.name}</span>
                        <span class="patient-id">${p.id}</span>
                    </div>
                `).join('') 
                : '<div class="empty-state">-</div>';
        });

        window.onclick = () => {
            ding.play().then(() => {
                ding.pause();
                console.log("Audio Enabled!");
            });
        };
    </script>
