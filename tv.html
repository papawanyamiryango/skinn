<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Providence - TV Display Premium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #1e88e5;
            --accent-cyan: #00f2ff;
            --bg-dark: #0a1929;
            --bg-card: #132f4c;
            --text-white: #ffffff;
            --missed-red: #f43f5e;
            --border-glow: rgba(30, 136, 229, 0.3);
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a1929 0%, #1a237e 100%);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            color: var(--text-white);
            position: relative;
        }

        /* Animated Background Pattern */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(30, 136, 229, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 242, 255, 0.1) 0%, transparent 50%);
            animation: bgPulse 10s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        /* Main Grid Layout */
        .tv-container {
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100vh;
            position: relative;
            z-index: 1;
            padding: 15px;
            gap: 15px;
        }

        /* ========== HEADER WITH LOGO ========== */
        .header {
            background: rgba(19, 47, 76, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            border: 2px solid rgba(30, 136, 229, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .logo-container {
            width: 80px;
            height: 80px;
            animation: logoFloat 3s ease-in-out infinite;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0, 242, 255, 0.5));
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .hospital-name {
            text-align: center;
        }

        .hospital-name h1 {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 12px;
            margin: 0;
            background: linear-gradient(90deg, var(--text-white), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 242, 255, 0.5);
        }

        .hospital-name p {
            font-size: 1rem;
            letter-spacing: 4px;
            color: var(--accent-cyan);
            margin-top: 5px;
            opacity: 0.8;
        }

        /* ========== MAIN CONTENT GRID ========== */
        .content-grid {
            display: grid;
            grid-template-columns: 1.2fr 2fr 0.8fr;
            gap: 15px;
            height: 100%;
        }

        /* Section Box Styling */
        .section-box {
            background: rgba(19, 47, 76, 0.6);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 25px;
            border: 2px solid var(--border-glow);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .section-title {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 12px;
            border-bottom: 3px solid;
        }

        /* ========== CURRENT PATIENT (CENTER) ========== */
        .now-calling {
            background: linear-gradient(135deg, rgba(19, 47, 76, 0.9), rgba(10, 25, 41, 0.9));
            border: 4px solid var(--accent-cyan);
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .now-calling::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 242, 255, 0.1) 0%, transparent 70%);
            animation: rotateGlow 8s linear infinite;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .calling-content {
            position: relative;
            z-index: 2;
        }

        .enter-label {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--accent-cyan);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.8);
            animation: labelPulse 2s ease-in-out infinite;
        }

        @keyframes labelPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .current-id {
            font-size: 18rem;
            font-weight: 900;
            line-height: 0.9;
            background: linear-gradient(135deg, var(--accent-cyan), var(--primary-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px rgba(0, 242, 255, 0.6);
            margin: 20px 0;
            animation: numberZoomIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes numberZoomIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .current-name {
            font-size: 4rem;
            font-weight: 700;
            color: var(--text-white);
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .flash-border {
            animation: flashBorder 1s ease-in-out 3;
        }

        @keyframes flashBorder {
            0%, 100% { border-color: var(--accent-cyan); }
            50% { border-color: #00ff88; box-shadow: 0 0 40px rgba(0, 255, 136, 0.6); }
        }

        /* ========== WAITING LIST ========== */
        .waiting-section .section-title {
            background: rgba(30, 136, 229, 0.2);
            color: var(--accent-cyan);
            border-bottom-color: var(--accent-cyan);
        }

        .list-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        .list-container::-webkit-scrollbar {
            width: 8px;
        }

        .list-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .list-container::-webkit-scrollbar-thumb {
            background: rgba(0, 242, 255, 0.3);
            border-radius: 10px;
        }

        .patient-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border-left: 4px solid var(--accent-cyan);
            transition: all 0.3s ease;
            animation: slideInRight 0.5s ease;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .patient-row:hover {
            background: rgba(0, 242, 255, 0.1);
            transform: translateX(5px);
        }

        .patient-name {
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--text-white);
        }

        .patient-id {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        /* ========== MISSED SECTION ========== */
        .missed-section .section-title {
            background: rgba(244, 63, 94, 0.2);
            color: var(--missed-red);
            border-bottom-color: var(--missed-red);
        }

        .missed-row {
            background: rgba(244, 63, 94, 0.08);
            border-left-color: var(--missed-red);
            padding: 14px 18px;
        }

        .missed-row .patient-name {
            font-size: 1.1rem;
            opacity: 0.8;
        }

        .missed-row .patient-id {
            font-size: 1.6rem;
            color: var(--missed-red);
            text-shadow: 0 0 8px rgba(244, 63, 94, 0.5);
        }

        /* ========== BOTTOM NUMBER DISPLAY (For people below TV) ========== */
        .bottom-display {
            background: rgba(10, 25, 41, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 25px;
            border: 3px solid var(--accent-cyan);
            box-shadow: 0 -8px 32px rgba(0, 242, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .bottom-label {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-cyan);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .bottom-number {
            font-size: 8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-cyan), var(--primary-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: numberZoomIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .bottom-name {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-white);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="tv-container">
        <!-- HEADER WITH LOGO -->
        <div class="header">
            <div class="logo-container">
                <img src="la-providence-logo.png" alt="La Providence Logo" id="logoImg">
            </div>
            <div class="hospital-name">
                <h1>POLYCLINIQUE MEDICALE LA PROVIDENCE</h1>
               
            </div>
            <div class="logo-container">
                <img src="la-providence-logo.png" alt="La Providence Logo">
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="content-grid">
            <!-- WAITING LIST -->
            <div class="section-box waiting-section">
                <div class="section-title">⏳ ABATEGEREJE</div>
                <div class="list-container" id="waitingList"></div>
            </div>

            <!-- CURRENT PATIENT -->
            <div class="section-box now-calling" id="mainBox">
                <div class="calling-content">
                    <div class="enter-label">BINJIRE / ENTER</div>
                    <div class="current-id" id="currId">--</div>
                    <div class="current-name" id="currName">TEGEREZA...</div>
                </div>
            </div>

            <!-- MISSED -->
            <div class="section-box missed-section">
                <div class="section-title">🚫 MISSED</div>
                <div class="list-container" id="missedList"></div>
            </div>
        </div>

        <!-- BOTTOM DISPLAY FOR PEOPLE BELOW -->
        <div class="bottom-display">
            <div class="bottom-label">CURRENT:</div>
            <div class="bottom-number" id="bottomId">--</div>
            <div class="bottom-name" id="bottomName"></div>
        </div>
    </div>

    <audio id="ding" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuNz2dvLH3NgwzQys9__0sTN0L1kbomFY",
            authDomain: "providence-e77b1.firebaseapp.com",
            databaseURL: "https://providence-e77b1-default-rtdb.firebaseio.com",
            projectId: "providence-e77b1",
            storageBucket: "providence-e77b1.firebasestorage.app",
            messagingSenderId: "1042528351641",
            appId: "1:1042528351641:web:2b1b1231e4341ccf73cf08"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const queueRef = db.ref('queue');
        const ding = document.getElementById('ding');

        let lastId = null;

        // Real-time listener
        queueRef.on('value', (snapshot) => {
            const data = snapshot.val() || {};
            const current = data.c || null;
            const pending = data.p || [];
            const missed = data.m || [];

            const newId = current ? current.id : "--";
            const newName = current ? current.name : "TEGEREZA...";

            // Update main display
            document.getElementById('currId').innerText = newId;
            document.getElementById('currName').innerText = newName;

            // Update bottom display (for people below TV)
            document.getElementById('bottomId').innerText = newId;
            document.getElementById('bottomName').innerText = newName !== "TEGEREZA..." ? newName : "";

            // Flash and sound on new patient
            if (newId !== lastId && newId !== "--") {
                ding.play().catch(() => console.log("Click to enable audio"));
                
                const mainBox = document.getElementById('mainBox');
                mainBox.classList.add('flash-border');
                setTimeout(() => mainBox.classList.remove('flash-border'), 3000);
                
                lastId = newId;
            }

            // Waiting list
            document.getElementById('waitingList').innerHTML = pending.length > 0 
                ? pending.slice(0, 10).map((p, i) => `
                    <div class="patient-row" style="animation-delay: ${i * 0.1}s">
                        <span class="patient-name">${p.name}</span>
                        <span class="patient-id">${p.id}</span>
                    </div>
                `).join('') 
                : '<div class="empty-state">Nta muntu uri ku murongo</div>';

            // Missed list
            document.getElementById('missedList').innerHTML = missed.length > 0 
                ? missed.slice(-6).reverse().map((p, i) => `
                    <div class="patient-row missed-row" style="animation-delay: ${i * 0.1}s">
                        <span class="patient-name">${p.name}</span>
                        <span class="patient-id">${p.id}</span>
                    </div>
                `).join('') 
                : '<div class="empty-state">-</div>';
        });

        // Enable audio on first click
        window.onclick = () => {
            ding.play().then(() => {
                ding.pause();
                console.log("Audio Enabled!");
            });
        };
    </script>
</body>
</html>
